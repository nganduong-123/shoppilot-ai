databases:
  - name: shoppilot-db
    plan: free
    databaseName: shoppilot
    user: shoppilot

services:
  - type: web
    name: shoppilot-ai
    runtime: docker
    plan: free
    healthCheckPath: /api/health/ready
    envVars:
      - key: APP_ENV
        value: production
      - key: PUBLIC_BASE_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: shoppilot-db
          property: connectionString
      - key: AUTH_REQUIRED
        value: "true"
      - key: REGISTRATION_ENABLED
        value: "true"
      - key: EMAIL_VERIFICATION_REQUIRED
        value: "false"
      - key: EMAIL_PROVIDER
        value: resend
      - key: EMAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: AUTH_RATE_LIMIT_REQUESTS
        value: "10"
      - key: AUTH_RATE_LIMIT_WINDOW_SECONDS
        value: "300"
      - key: CHAT_RATE_LIMIT_REQUESTS
        value: "60"
      - key: CHAT_RATE_LIMIT_WINDOW_SECONDS
        value: "60"
      - key: MAX_CSV_UPLOAD_BYTES
        value: "2000000"
      - key: MAX_CSV_ROWS
        value: "10000"
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: META_SHOP_SLUG
        value: mint-fashion
      - key: META_PAGE_ID
        sync: false
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_PAGE_ACCESS_TOKEN
        sync: false
      - key: META_VERIFY_TOKEN
        sync: false
      - key: META_GRAPH_API_VERSION
        value: v26.0
      - key: MAKE_BRIDGE_SECRET
        generateValue: true
      - key: MAKE_MESSENGER_OUTBOUND_WEBHOOK_URL
        sync: false
      - key: SHIPPING_QUOTE_URL
        sync: false
      - key: COMMERCE_ORDER_WEBHOOK_URL
        sync: false
      - key: INTEGRATION_WEBHOOK_SECRET
        generateValue: true
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_PRO
        sync: false
      - key: STRIPE_PRICE_BUSINESS
        sync: false
