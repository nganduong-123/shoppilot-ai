services:
  - type: web
    name: shoppilot-ai
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: PUBLIC_BASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: MAKE_BRIDGE_SECRET
        generateValue: true
      - key: MAKE_MESSENGER_OUTBOUND_WEBHOOK_URL
        sync: false
