name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: shoppilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d shoppilot_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql://postgres:test-only-password@localhost:5432/shoppilot_test' || '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests scripts
      - run: python -m compileall -q app scripts
      - run: pytest -q
      - run: python scripts/evaluate.py
      - run: pip-audit -r requirements.txt --progress-spinner off
      - uses: actions/setup-node@v5
        if: matrix.database == 'sqlite'
        with:
          node-version: "22"
      - name: Container and browser release gate
        if: matrix.database == 'sqlite'
        env:
          CHROME_PATH: /usr/bin/google-chrome
          SHOPPILOT_TEST_ADMIN: "true"
        run: |
          docker build -t shoppilot-ci .
          docker run -d --name shoppilot-ci -p 127.0.0.1:8000:8000 shoppilot-ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/api/health/ready; then break; fi
            sleep 2
          done
          curl --fail http://127.0.0.1:8000/api/health/ready
          docker exec -e SHOPPILOT_TEST_ADMIN=true shoppilot-ci python -m scripts.seed_e2e_admin
          node scripts/e2e_browser.mjs
      - name: Container diagnostics
        if: failure() && matrix.database == 'sqlite'
        run: docker logs shoppilot-ci || true
