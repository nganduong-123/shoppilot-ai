<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Chọn Facebook Page · ShopPilot AI</title>
  <style>:root{color-scheme:dark;--bg:#07110f;--panel:#0e1d1a;--line:#203a35;--text:#eef8f5;--muted:#7f9993;--accent:#24d5b5}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 20% 0,rgba(36,213,181,.12),transparent 35%),var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}.card{width:min(620px,100%);padding:30px;border:1px solid var(--line);border-radius:24px;background:var(--panel);box-shadow:0 30px 90px rgba(0,0,0,.35)}.brand{color:var(--accent);font-size:11px;font-weight:900;letter-spacing:1.6px}h1{margin:16px 0 8px;font-size:28px}p{color:var(--muted);font-size:13px;line-height:1.55}.pages{display:grid;gap:10px;margin:24px 0}.page{width:100%;display:flex;align-items:center;gap:13px;padding:14px;border:1px solid var(--line);border-radius:14px;background:#091613;color:var(--text);text-align:left;cursor:pointer}.page:hover,.page.selected{border-color:var(--accent);background:rgba(36,213,181,.06)}.avatar{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;background:#1877f2;color:#fff;font-weight:900}.page strong,.page small{display:block}.page small{margin-top:4px;color:var(--muted)}.submit{width:100%;padding:13px;border:0;border-radius:11px;background:var(--accent);color:#05201a;font-weight:900;cursor:pointer}.submit:disabled{opacity:.45}.error{padding:14px;border:1px solid rgba(255,99,125,.3);border-radius:12px;background:rgba(255,99,125,.08);color:#ff9cac}.back{display:block;margin-top:16px;color:var(--muted);font-size:12px;text-align:center;text-decoration:none}</style>
</head>
<body><main class="card"><div class="brand">SHOPPILOT AI · META CONNECT</div><h1>Chọn Page cần kết nối</h1><p>ShopPilot chỉ nhận token do Meta cấp. Mật khẩu Facebook của anh/chị không được gửi tới hệ thống.</p><div id="content"><p>Đang tải danh sách Page…</p></div><a class="back" href="/?view=integrations">← Quay lại Integrations</a></main>
<script>
const params=new URLSearchParams(location.search),state=params.get("state"),error=params.get("error"),content=document.querySelector("#content");let selected=null,data=null;
function fail(message){content.innerHTML=`<div class="error">${String(message).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"})[c])}</div>`}
async function load(){if(error){fail(error);return}if(!state){fail("Thiếu phiên kết nối Meta.");return}const response=await fetch(`/api/integrations/meta/candidates?state=${encodeURIComponent(state)}`);data=await response.json();if(!response.ok){fail(data.detail||"Không tải được Page");return}content.innerHTML=`<div class="pages">${data.pages.map(page=>`<button class="page" data-id="${page.id}"><span class="avatar">f</span><span><strong>${page.name}</strong><small>Page ID · ${page.id}</small></span></button>`).join("")}</div><button class="submit" disabled>Kết nối Page đã chọn</button>`;document.querySelectorAll(".page").forEach(button=>button.onclick=()=>{selected=button.dataset.id;document.querySelectorAll(".page").forEach(x=>x.classList.toggle("selected",x===button));document.querySelector(".submit").disabled=false});document.querySelector(".submit").onclick=complete}
async function complete(){const button=document.querySelector(".submit");button.disabled=true;button.textContent="Đang đăng ký webhook…";const shop=(await (await fetch("/api/auth/me")).json()).shops.find(item=>item.id===data.shop_id);if(!shop){fail("Tài khoản không có quyền với shop này.");return}const response=await fetch(`/api/shops/${shop.slug}/integrations/meta/complete`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({state,page_id:selected})});const result=await response.json();if(!response.ok){fail(result.detail||"Kết nối thất bại");return}location.href="/?view=integrations&connected=1"}
load().catch(exc=>fail(exc.message));
</script></body></html>
